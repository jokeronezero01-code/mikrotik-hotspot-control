services:
  hotspot-db:
    image: postgres:15-alpine
    container_name: hotspot-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: hotspot_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  hotspot-redis:
    image: redis:7-alpine
    container_name: hotspot-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: